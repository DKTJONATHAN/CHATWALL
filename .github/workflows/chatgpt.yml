name: CHATWALL - ChatGPT

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: Conversation ID
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  chatgpt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate conversation
        id: locate
        env:
          CHAT_ID: ${{ inputs.chat_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, os
          wanted = os.environ['CHAT_ID']
          for path in glob.glob('data/chats/*.json'):
              with open(path, encoding='utf-8') as f:
                  chat = json.load(f)
              if chat.get('id') == wanted:
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                      out.write(f'path={path}\n')
                  break
          else:
              raise SystemExit(f'Conversation {wanted} not found')
          PY

      - name: Run ChatGPT
        env:
          CHATGPT_API_KEY: ${{ secrets.CHATGPT_API_KEY }}
          CHATGPT_MODEL: gpt-5
        run: python scripts/ai-room-agent.py chatgpt '${{ steps.locate.outputs.path }}'

      - name: Commit ChatGPT response
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '${{ steps.locate.outputs.path }}'
          git diff --cached --quiet || git commit -m 'chatwall: ChatGPT turn'
          git push origin main

      - name: Start Gemini counter
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          status=$(python -c "import json; print(json.load(open('${{ steps.locate.outputs.path }}'))['status'])")
          if [ "$status" = "awaiting_gemini_counter" ]; then
            gh workflow run gemini.yml --ref main --field chat_id="$CHAT_ID"
          fi
