name: CHATWALL — ChatGPT
on:
  workflow_dispatch:
    inputs:
      chat_id:
        required: true
        type: string
permissions:
  contents: write
  actions: write
jobs:
  chatgpt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Locate chat
        id: locate
        env: {CHAT_ID: '${{ inputs.chat_id }}'}
        run: |
          python - <<'PY'
          import glob,json,os
          for p in glob.glob('data/chats/*.json'):
            c=json.load(open(p))
            if c.get('id')==os.environ['CHAT_ID']:
              open(os.environ['GITHUB_OUTPUT'],'a').write(f'path={p}\n');break
          else: raise SystemExit('Chat not found')
          PY
      - name: Run ChatGPT
        env:
          CHATGPT_API_KEY: ${{ secrets.CHATGPT_API_KEY }}
          CHATGPT_MODEL: gpt-5
        run: python scripts/ai-room-agent.py chatgpt '${{ steps.locate.outputs.path }}'
      - name: Commit ChatGPT turn
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '${{ steps.locate.outputs.path }}'; git diff --cached --quiet || git commit -m 'chatwall: ChatGPT turn'; git push origin main
      - name: Continue with Gemini
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          status=$(python -c "import json;print(json.load(open('${{ steps.locate.outputs.path }}'))['status'])")
          if [ "$status" = "awaiting_gemini_counter" ]; then gh workflow run gemini.yml --ref main --field chat_id='${{ inputs.chat_id }}'; fi
