name: CHATWALL — Gemini
on:
  push:
    branches: [main]
    paths: ['data/chats/*.json']
  workflow_dispatch:
    inputs:
      chat_id:
        required: false
        type: string
permissions:
  contents: write
  actions: write
jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Find waiting chat
        id: find
        env:
          CHAT_ID: '${{ inputs.chat_id || '' }}'
          EVENT: '${{ github.event_name }}'
        run: |
          python - <<'PY'
          import glob,json,os
          wanted=os.environ['CHAT_ID']; event=os.environ['EVENT']; found=[]
          allowed={'awaiting_gemini'} if event=='push' else {'awaiting_gemini','awaiting_gemini_counter'}
          for p in glob.glob('data/chats/*.json'):
            try:c=json.load(open(p))
            except:continue
            if (not wanted or c.get('id')==wanted) and c.get('status') in allowed: found.append((c.get('updated_at',''),p,c.get('id')))
          if found:
            _,p,i=sorted(found)[0]; o=open(os.environ['GITHUB_OUTPUT'],'a'); o.write(f'found=true\npath={p}\nid={i}\n'); o.close()
          else: open(os.environ['GITHUB_OUTPUT'],'a').write('found=false\n')
          PY
      - name: Run Gemini
        if: steps.find.outputs.found == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python scripts/ai-room-agent.py gemini '${{ steps.find.outputs.path }}'
      - name: Commit Gemini turn
        if: steps.find.outputs.found == 'true'
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '${{ steps.find.outputs.path }}'; git diff --cached --quiet || git commit -m 'chatwall: Gemini turn'; git push origin main
      - name: Continue with ChatGPT
        if: steps.find.outputs.found == 'true'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          status=$(python -c "import json;print(json.load(open('${{ steps.find.outputs.path }}'))['status'])")
          if [ "$status" = "awaiting_chatgpt" ]; then gh workflow run chatgpt.yml --ref main --field chat_id='${{ steps.find.outputs.id }}'; fi
