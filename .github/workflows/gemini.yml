name: CHATWALL - Gemini

on:
  push:
    branches: [main]
    paths:
      - 'data/chats/*.json'
  workflow_dispatch:
    inputs:
      chat_id:
        description: Conversation ID
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate conversation
        id: locate
        env:
          CHAT_ID: ${{ inputs.chat_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, os
          wanted = os.environ.get('CHAT_ID')
          candidates = []
          for path in glob.glob('data/chats/*.json'):
              with open(path, encoding='utf-8') as f:
                  chat = json.load(f)
              if wanted and chat.get('id') == wanted:
                  candidates = [path]
                  break
              if not wanted and chat.get('status') == 'awaiting_gemini':
                  candidates.append(path)
          if not candidates:
              raise SystemExit('No conversation awaiting Gemini')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'path={candidates[-1]}\n')
          PY

      - name: Run Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python scripts/ai-room-agent.py gemini '${{ steps.locate.outputs.path }}'

      - name: Commit Gemini response
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '${{ steps.locate.outputs.path }}'
          git diff --cached --quiet || git commit -m 'chatwall: Gemini turn'
          git push origin main

      - name: Start ChatGPT
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CHAT_ID: ${{ inputs.chat_id || '' }}
        run: |
          if [ -z "$CHAT_ID" ]; then CHAT_ID=$(python -c "import json; print(json.load(open('${{ steps.locate.outputs.path }}'))['id'])"); fi
          status=$(python -c "import json; print(json.load(open('${{ steps.locate.outputs.path }}'))['status'])")
          if [ "$status" = "awaiting_chatgpt" ]; then gh workflow run chatgpt.yml --ref main --field chat_id="$CHAT_ID"; fi
